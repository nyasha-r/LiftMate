
version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR
      - aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin 191447408389.dkr.ecr.ap-southeast-2.amazonaws.com
  build:
    commands:
      - docker build -t liftmate .
      - docker tag liftmate:latest 191447408389.dkr.ecr.ap-southeast-2.amazonaws.com/liftmate:latest
  post_build:
    commands:
      - docker push 191447408389.dkr.ecr.ap-southeast-2.amazonaws.com/liftmate:latest

